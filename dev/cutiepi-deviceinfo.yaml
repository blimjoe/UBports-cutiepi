cutiepi:
  Name: cutiepi
  PrettyName: CutiePi
  DeviceType: tablet
  BacklightSysfsPath: /sys/class/backlight/rpi_backlight
  # QtMir 0.7.2 misaligns touch coordinates at fractional output scales.
  GridUnit: 8
  WebkitDpr: 1
  PrimaryOrientation: Portrait
  SupportedOrientations:
    - Portrait
    - Landscape
    - InvertedPortrait
    - InvertedLandscape
